version: 1
root:
  include: ['**/*.sql']
  exclude: ['.git/**', '.sql-organizer/**', 'node_modules/**', 'duplicates/**', 'archive/**', 'modules/**']
  inbox: ['inbox/**']
  maxFileBytes: 300000
taxonomy:
  mode: adaptive
  allowNewCategories: true
  maxContextExamples: 12
  categories: [customer, booking, invoice, access, login, reporting, operations, system, unknown]
splitting:
  enabled: true
  archiveOriginalAfterSplit: false
  maxStatementsPerFile: 200
  keepProceduralBlocksTogether: true
organization:
  mode: module-files
  moduleFolder: modules
classification:
  lowConfidenceThreshold: 0.70
  autoApproveThreshold: 0.95
  enableAutoApprove: false
  unknownCategory: unknown
  unclassifiedFolder: unclassified
ai:
  provider: openai
  model: ''
  # Optional model list for this endpoint. Analyze prompts for a model when multiple entries exist.
  models: []
  # Optional. Example: https://api.openai.com/v1 or http://localhost:11434/v1
  baseUrl: ''
  # "responses" for OpenAI Responses API; "chat-completions" for compatible endpoints.
  apiProtocol: responses
safety:
  dryRunByDefault: true
  requireGitRepository: false
  requireCleanGitForApply: true
  neverOverwrite: true
  verifySourceHashBeforeApply: true
  allowOutsideWorkspace: false
  allowSymlinks: false
